# ---------------------------------------------------- intro

[intro]
text = "Welcome. This is where I introduce the game. You can type quit at any time to quit the game."

[intro.choices.1]
text = "Play"
target = "studio"

# ---------------------------------------------------- studio

[studio]
text = ["""You are sitting at your desk. Your favorite art supplies and a cup of cold coffee are in front of you.
Sunlight streams in the big windows, you can feel the warmth. What a perfect day to make some art!
Or... drink some of that coffee. Did you make that yesterday, or this morning?""",
"""It's getting a little chilly. You didn't realize how much the sunlight warmed your studio.
There's probably still time to get a little more work in before it's time to go.""",
"""It's late, you're pretty tired. Still determined to do more though.
Something tells you it's probably time to rest, but you just don't want to stop."""]

[studio.story]
type = "studio_time"

[studio.status]
type = "game_stats"

[studio.choices.1]
text = "Drink the cold coffee."
action = "drink_coffee"

[studio.choices.2]
text = "Create something!"
action = "create"

[studio.choices.3]
text = "Go home."
target = "home"

#[studio.choices.2]
#text = "Go to the gallery."
#target = "gallery"

[studio.choices.1.responses]
1 = ["Gulp. Ugh, bitter!", "It may be cold, and bitter, but at least it's strong!", "Sip. Hmm. Needs something. Like good coffee."]
2 = ["Your hands begin to shake, be careful!", "OhWowThisDoesn'tTasteSoSoBad!", "Ahhh lots of energy! And lots. And lots. Whoa."]
lose = ["Not good, the room spins, panic sets in...", "You drank too much coffee."]

[studio.choices.2.responses]
1 = ['After much angst and deep thought, you created << artwork title >>. Amazing.',
'You translated your internal "<< player mood >>" into something new!',
"You've meticulously crafted your next masterpiece! Well hopefully anyway."]
error = ["Ugh! Despite how hard you try, nothing comes to mind.",
"Bummer, you started on a few different things but they just didn't work out.",
"Awww, crap. That didn't work at all. Grrr..."]
lose = ["Uh oh, something doesn't feel right. You might need to... (thump) Too late.", "You became exhausted and fainted."]

# ---------------------------------------------------- home

[home]
text = """You walk in, lock the door, and toss you keys on the table.
Your comfy bed looks very inviting."""

[home.status]
type = "game_stats"

[home.choices.1]
text = "Go to sleep"
action = "nap"

[home.choices.2]
text = "Go to your studio."
target = "studio"

[home.choices.1.responses]
1 = ["Flop... Ahhh!", "Zzzzzzz..."]
2 = ["Zzzz... blink... Oh no, look at how late it is!", "Oh wow that was a great... yikes the time!"]
error = ["Eh, not tired enought to sleep yet.", "No sleep for you!!! Not yet anyway"]
lose = ["The day passes as you are still in bed. Unfortunately you missed an important deadline.", "You slept too long."]



# ---------------------------------------------------- gallery

[gallery]
text = "Your work is a success! You win!"

[gallery.status]
type = "game_stats"

[gallery.commands]
type = "hide"

[gallery.choices]
# Empty

# ---------------------------------------------------- quit

[quit]
text = "Sorry to see you go. Goodbye!"

[quit.commands]
type = "hide"

[quit.choices]
# Empty

# ---------------------------------------------------- lose

[lose]
text = """You were found frantically trying to eat the bristles off all your paintbrushes.
You and your therapist decide together it's best to choose a new career."""

[lose.status]
text = "Sorry, you lost. "

[lose.commands]
type = "hide"

[lose.choices]
# Empty

# ---------------------------------------------------- setup

[setup]
text = """If you would like to resize the screen to match a new terminal width, choose Set New Screen Size.
If you want to change the delay time of the response messages at the bottom of the screen, choose Change Delay.
Current settings are shown in the status bar under the title."""

[setup.status]
type = "setup_stats"

[setup.choices.1]
text = "Return to game"
target = "<< prev >>"

[setup.choices.2]
text = "Set New Screen Size"
action = "set_width"

[setup.choices.3]
text = "Change Delay"
action = "set_delay"
