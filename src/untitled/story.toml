# ---------------------------------------------------- intro

[intro]
text = "Welcome. This is where I introduce the game. You can type quit at any time to quit the game."

[intro.choices.1]
text = "Play"
target = "studio"

# ---------------------------------------------------- studio

[studio]
text = "You are sitting at your desk. Your favorite art supplies and a cup of cold coffee are in front of you."

[studio.status]
type = "game_stats"

[studio.choices.1]
text = "Drink the cold coffee."
action = "drink_coffee"

[studio.choices.2]
text = "Go to the gallery."
target = "gallery"

[studio.choices.1.responses]
1 = ["Gulp. Ugh, bitter!", "It may be cold, and bitter, but at least it's strong!", "Sip. Hmm. Needs something. Like good coffee."]
2 = ["Your hands begin to shake, be careful!", "OhWowThisDoesn'tTasteSoSoBad!", "Ahhh lots of energy! And lots. And lots. Whoa."]
lose = ["Not good, the room spins, panic sets in...", "You drank too much coffee."]

# ---------------------------------------------------- gallery

[gallery]
text = "Your work is a success! You win!"

[gallery.status]
type = "game_stats"

[gallery.commands]
type = "hide"

[gallery.choices]
# Empty

# ---------------------------------------------------- quit

[quit]
text = "Sorry to see you go. Goodbye!"

[quit.commands]
type = "hide"

[quit.choices]
# Empty

# ---------------------------------------------------- lose

[lose]
text = """You were found frantically trying to eat the bristles off all your paintbrushes.
You and your therapist decide together it's best to choose a new career."""

[lose.status]
text = "Sorry, you lost. "

[lose.commands]
type = "hide"

[lose.choices]
# Empty

# ---------------------------------------------------- setup

[setup]
text = """If you would like to resize the screen to match a new terminal width, choose Set New Screen Size.
If you want to change the delay time of the response messages at the bottom of the screen, choose Change Delay.
Current settings are shown in the status bar under the title."""

[setup.status]
type = "setup_stats"

[setup.choices.1]
text = "Return to game"
target = "<< prev >>"

[setup.choices.2]
text = "Set New Screen Size"
action = "set_width"

[setup.choices.3]
text = "Change Delay"
action = "set_delay"
