# ---------------------------------------------------- intro

[intro]
text = """Welcome. I hope you have fun, or get annoyed. Or both.
If it's neither, please pretend at least one of them was true.

Anyway...

Ohhh, I forgot to explain WHAT it's about. Your goal is to become a successful, valued artist.
Yes, in a text-based game.
It sounded like a good idea at the time.

It's not done, and it was more fun to make new stuff instead of testing, so... yeah."""

[intro.status]
text = "Hi! Pay attention to the stuff that will show up here."

[intro.choices.1]
text = "Play"
target = "studio"

# ---------------------------------------------------- studio

[studio]
text = ["""You are sitting at your desk. Your favorite art supplies and a cup of cold coffee are in front of you.
Sunlight streams in the big windows, you can feel the warmth. What a day to make some art!
Or... drink some of that coffee. Did you make that yesterday, or this morning?""",
"""It seems a little chily in here, despite the fact that you can see plenty of sunlight.
Can it be time to go already? Surely not, maybe you're just a little moody.
Rest does sound kinda nice though.""",
"""It's late, you're pretty tired. Still determined to do more though.
Something tells you it's probably time to rest, but you just don't want to stop."""]
story_type = "time_awake"

[studio.status]
type = "game_stats"

[studio.choices.1]
text = "Drink the cold coffee."
action = "drink_coffee"

[studio.choices.2]
text = "Create something!"
action = "create"

[studio.choices.3]
text = "Look through your art."
target = "catalog"

[studio.choices.4]
text = "Go home."
target = "home"

#[studio.choices.2]
#text = "Go to the gallery."
#target = "gallery"

[studio.choices.1.responses]
1 = ["Gulp. Ugh, bitter!", "It may be cold, and bitter, but at least it's strong!", "Sip. Hmm. Needs something. Like good coffee."]
2 = ["Your hands begin to shake, be careful!", "OhWowThisDoesn'tTasteSoSoBad!", "Ahhh lots of energy! And lots. And lots. Whoa."]
fail = "You spilled your coffee. Again."
error = "Well, you thought that was coffee. It's not."
lose = ["Not good, the room spins, panic sets in...", "You drank too much coffee."]

[studio.choices.2.responses]
1 = ['After much angst and deep thought, you created << artwork title >>. Amazing.',
'You translated your internal "<< player mood >>" into something new!',
"You've meticulously crafted your next masterpiece! Well hopefully anyway."]
2 = "You worked really, really, really, really, really hard to create << artwork title >>! REALLY!"
fail = ["Ugh! Despite how hard you try, nothing comes to mind.",
"Bummer, you started on a few different things but they just didn't work out.",
"Awww, crap. That didn't work at all. Grrr..."]
error = "Hmmm, something's missing."
lose = ["Uh oh, something doesn't feel right. You might need to... (thump) Too late.", "You became exhausted and fainted."]

# ---------------------------------------------------- home

[home]
text = """You walk in, lock the door, and toss you keys on the table.
Your comfy bed looks very inviting."""

[home.status]
type = "game_stats"

[home.choices.1]
text = "Go to sleep"
action = "nap"

[home.choices.2]
text = "Go to your studio."
target = "studio"

[home.choices.1.responses]
1 = ["Flop... Ahhh!", "Zzzzzzz..."]
2 = ["Zzzz... blink... Oh no, look at how late it is!", "Oh wow that was a great... yikes the time!"]
fail = ["You tried, unfortunately sleep didn't come.", "After squeezing your eyes shut for a bit, you gave up."]
error = ["Eh, not tired enought to sleep yet.", "No sleep for you!!! Not yet anyway..."]
lose = ["The day passes as you are still in bed. Unfortunately you missed an important deadline.", "You slept too long."]

# ---------------------------------------------------- catalog

[catalog]
text = """You look at your work scattered around, sort-of-organized. Maybe one day you'll get around to cleaning it up.
Actually it's pretty messy, but it's better if you don't acknowledge that.
You can do some stuff with your art, but try to make sure nothing bad happens!"""
data_type = "catalog"

[catalog.status]
type = "game_stats"

[catalog.choices.1]
text = "Toss one of your works."
action = "delete_work"

[catalog.choices.2]
text = "Rework one of your works."
action = "rework_work"

[catalog.choices.3]
text = "Sell one of your works."
action = "sell_work"

[catalog.choices.4]
text = "Go to your studio."
target = "studio"

[catalog.choices.5]
text = "Go home."
target = "home"

[catalog.choices.1.responses]
1 = ["Well, you sucessfuly demolished that. Destroyed. Utterly vaporized.",
"You cast interdimensional wormhole! Okay, maybe that's a little overdramatic...",
"Item deleted. In a robot voice."]
2 = ["Good news! you got rid of what you wanted. Bad news... you got rid of something else too. Oops.",
"Congratulations, you got a surprise two-for-one special!",
"Hope you didn't need that other one."]
fail = ["Well, that didn't work.", "You tried. But you know what they say about trying."]
error = ["Hmm, I don't think you can get rid of something that doesn't exist.", "Poof! ...aaaand nothing was there in the first place."]
lose = ["Wait, stop! Uh oh, I think you might have went a little too far...", "You destroyed your whole studio by mistake."]

[catalog.choices.2.responses]
1 = "Good news! It's better now!"
2 = "bad news. It's worse now."
fail = ["You tried, but it just didn't help.", "Ugh, that was wasted effort. That stinks."]
error = ["Can't change what you don't have.", "Did you imagine an artwork again???"]
lose = ["Well... I think you might be in trouble here.", "You worked too hard."]

# ---------------------------------------------------- win

[win]
text = ["""Your work is a success! After a long, difficult journey, navigating pitfalls along the way, you've managed to win "the game"!
(By the way, you lost The Game. Not this game, the other one. If you have no idea what that means, don't worry about it. If you do, you're welcome.)""",
"""I'm so sorry to see you go, we were having great fun together. Me annoying you with randomly changing stuff, you... being annoyed...
I could always go back a few steps, just for fun. No??? Well, okay. Sigh, I guess we can be done for now. See you back again soon!!!""",
"""Are you sure you don't want to eat your paintbrushes instead?
(Please don't, I cause myself enough trouble already. Regular snacks are fine.)
I hope you have an ARTful day!""",
"""You were found frantically trying to eat the bristles off all your paintbrushes.
You and your therapist decide together it's best to choose a new career.
Check above for the real ending. Hehehe.""",
"""This was SO fun! I enjoyed being with you on your completely uneventful and easy journey. Wait, it WAS?

*typing: make loss and failue mechanics more likely... add some more randomization...*

Ahh, ignore that, just making some personal notes, nothing you need to worry about."""]
story_type = "random"
data_type = "catalog"

[win.status]
type = "win_stats"
text = "Congratulations, you're a successful artist."

[win.commands]
type = "hide"

[win.choices]
# Empty

